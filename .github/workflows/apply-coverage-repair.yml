name: apply coverage repair

on:
  push:
    branches:
      - coverage/programme-census

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coverage/programme-census
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: apply deterministic coverage repair
        run: python scripts/apply_coverage_repair.py
      - name: run coverage census and core validation
        run: |
          python scripts/audit_programme_coverage.py --strict --report generated/programme-coverage.json
          python scripts/validate_data_v3.py
          python scripts/validate_programme_data.py
          python scripts/validate_sources.py
      - name: remove one-off repair machinery
        run: rm .github/workflows/apply-coverage-repair.yml scripts/apply_coverage_repair.py
      - name: commit repair
        run: |
          git config user.name "hangabout-coverage[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair programme coverage and add coverage census"
          git push origin HEAD:coverage/programme-census
