name: apply venue grouping patch

on:
  push:
    branches: [ui/group-exhibitions-by-venue]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/group-exhibitions-by-venue
      - name: apply grouping patch
        run: python scripts/apply_venue_grouping_patch.py
      - name: remove one-off patch helpers
        run: |
          rm .github/workflows/apply-venue-grouping.yml
          rm scripts/apply_venue_grouping_patch.py
      - name: commit patch
        run: |
          git config user.name "hangabout-ui[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group exhibitions by venue in see-art list"
          git push origin HEAD:ui/group-exhibitions-by-venue
