name: prepare v1.0.1 metadata

on:
  push:
    branches: [release/v1.0.1]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: align package metadata
        run: npm version 1.0.1 --no-git-tag-version
      - name: commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump package metadata to v1.0.1"
          git push origin HEAD:release/v1.0.1
