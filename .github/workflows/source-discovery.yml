name: source discovery

on:
  schedule:
    # Run daily after the source refresh window so new/current programme links
    # are discovered promptly rather than waiting for a weekly sweep.
    - cron: '47 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: validate source policy
        run: python scripts/validate_sources.py
      - name: discover first-party programme links
        run: python scripts/discover_official.py
      - name: upload discovery queue
        uses: actions/upload-artifact@v4
        with:
          name: hangabout-source-discovery
          path: generated/source-discovery.json
          retention-days: 14
