name: scheduled source refresh

on:
  schedule:
    # 04:17 Australia/Melbourne during standard time (05:17 during daylight
    # time); verification dates are calculated explicitly in Melbourne time.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: hangabout-source-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate source policy and data before refresh
        run: |
          python scripts/validate_sources.py
          python scripts/validate_data_v3.py
      - name: refresh permitted studio listings
        run: python scripts/refresh_sources.py --apply --report generated/source-refresh.json --delay 1
      - name: reverify canonical current programme
        run: python scripts/reverify_programme.py --apply --report generated/programme-reverify.json --delay 1
      - name: validate refreshed data
        run: |
          python scripts/validate_data_v3.py
          python scripts/validate_programme_data.py
          python scripts/validate_sources.py
          python -m unittest discover -s tests/python
      - name: validate application build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangabout-source-refresh-${{ github.run_id }}
          path: |
            generated/source-refresh.json
            generated/programme-reverify.json
          if-no-files-found: warn
          retention-days: 30
      - name: detect safe canonical data changes
        id: changes
        run: |
          if git diff --quiet -- data/studio-vacancies.json data/events-current.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: publish validated refresh to main
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved during refresh; refusing to publish stale-base data"
            exit 1
          fi
          git config user.name "hangabout-source-refresh[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/studio-vacancies.json data/events-current.json
          git commit -m "Refresh verified live source records"
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not recursively trigger push workflows, so
          # dispatch the production verification/deploy pipeline explicitly.
          gh workflow run pages.yml --ref main
