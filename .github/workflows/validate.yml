name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: compile Python tooling
        run: python -m py_compile scripts/validate_data_v3.py scripts/validate_coordinates.py scripts/validate_sources.py scripts/validate_known_places.py scripts/validate_freshness.py scripts/discover_official.py scripts/validate_national_contract.py scripts/ingest_fixtures.py scripts/ingestion/replay.py
      - name: test freshness reporting
        run: python -m unittest discover -s tests/python
      - name: validate data contract
        run: python scripts/validate_data_v3.py
      - name: validate coordinate provenance
        run: python scripts/validate_coordinates.py
      - name: validate source policy
        run: python scripts/validate_sources.py
      - name: validate statewide known art places
        run: python scripts/validate_known_places.py
      - name: validate national geography contract
        run: python scripts/validate_national_contract.py
      - name: replay offline ingestion fixtures
        run: python scripts/ingest_fixtures.py --report generated/ingestion-review.json
      - name: upload ingestion review
        uses: actions/upload-artifact@v4
        with:
          name: hangabout-ingestion-review
          path: generated/ingestion-review.json
      - name: audit live-facing freshness
        run: python scripts/validate_freshness.py --report generated/freshness-recheck.json
      - name: upload freshness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangabout-freshness-audit
          path: generated/freshness-recheck.json
      - name: install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: typecheck v2
        run: npm run typecheck
      - name: install browser test runtime
        run: npx playwright install --with-deps chromium webkit
      - name: test desktop and mobile interactions
        run: npm run test:e2e
      - name: build v2
        run: npm run build
