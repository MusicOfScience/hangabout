name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: compile Python tooling
        run: python -m py_compile scripts/validate_data_v3.py scripts/validate_coordinates.py scripts/validate_sources.py scripts/validate_known_places.py scripts/validate_freshness.py scripts/discover_official.py
      - name: validate data contract
        run: python scripts/validate_data_v3.py
      - name: validate coordinate provenance
        run: python scripts/validate_coordinates.py
      - name: validate source policy
        run: python scripts/validate_sources.py
      - name: validate statewide known art places
        run: python scripts/validate_known_places.py
      - name: block stale live-facing data
        run: python scripts/validate_freshness.py
      - name: install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: typecheck v2
        run: npm run typecheck
      - name: build v2
        run: npm run build
